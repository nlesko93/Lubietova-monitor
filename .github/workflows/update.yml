name: Aktualizácia dát a nasadenie

on:
  schedule:
    # GitHub naplánované behy pri vyťažení odkladá alebo vynecháva (v praxi
    # sa hodinový cron spúšťal len raz za 4–8 h). Tri pokusy za hodinu mimo
    # celej hodiny zvyšujú šancu; pomalé zdroje sa berú z cache (lib.mjs →
    # cached), takže to zdroje nezaťažuje. Spoľahlivý externý spúšťač: README.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Stiahnuť všetko nanovo (ignorovať cache pomalých zdrojov)'
        type: boolean
        default: false
  push:
    branches: [main, claude/lubietova-osint-dashboard-reycfe]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nástroje (pdftotext pre cestovné poriadky)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Stiahnuť dáta zo zdrojov
        env:
          NO_CACHE: ${{ inputs.no_cache && '1' || '0' }}
        run: node scripts/fetch/all.mjs

      - name: Zhrnutie dát
        run: |
          echo "## Stav zdrojov" >> "$GITHUB_STEP_SUMMARY"
          for f in data/*.json; do
            ok=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$f')).ok)")
            n=$(node -e "const d=JSON.parse(require('fs').readFileSync('$f'));console.log(d.items?d.items.length:'-')")
            echo "- \`$f\` ok=$ok items=$n" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Overenie nasadenej stránky
        run: |
          sleep 10
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Kontrolujem $url"
          curl -sSf "$url" | grep -q "Ľubietová" && echo "OK: stránka beží"
          curl -sSf "${url}data/news.json" | head -c 200
          echo
          echo "== kontrola autobusov =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/buses.json'));for(const l of d.lines||[]){console.log('linka',l.line,'geometria bodov:',l.geometry?l.geometry.length:0,'dĺžka cum:',l.cum?l.cum[l.cum.length-1]:'-');for(const dir of l.directions||[]){console.log('  smer',dir.dir,'zastávok:',dir.stops.length,'s dist:',dir.stops.filter(s=>s.dist!=null).length,'odchodov:',dir.departures.length);for(const s of dir.stops)console.log('    -',s.name,'časov:',s.times.length);}}"
          echo
          echo "== kontrola webkamier =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/webcams.json'));for(const c of d.items||[]){console.log('-',c.name,'ok='+c.ok,c.snapshot?('snapshot='+c.snapshot):'',c.embed?('embed='+c.embed):'',c.note?('note='+c.note):'');if(c.found&&c.found.length)console.log('    obrázky na stránke:',c.found.join(' , '));}"
          echo
          echo "== kontrola volieb =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/elections.json'));for(const it of d.items||[]){const rows=it.rows||it.sections.flatMap(s=>s.rows);console.log('-',it.key,it.name,'|',rows.length,'položiek |',rows.slice(0,3).map(r=>r.name+':'+r.votes).join(', '));}"
          echo
          echo "== kontrola hospodárenia =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/finance.json'));if(!d.ok)console.log('CHYBA',d.error);for(const e of d.entities||[])console.log('-',e.key,e.name,'| závierok',e.items.length,'|',(e.series||[]).map(s=>s.year+': V '+s.revenue+' VH '+s.profit+' M '+s.assets).join(' ; '));"
          echo
          echo "== kontrola bazos =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/bazos.json'));console.log('status',d._status,'html',d._htmlKb+'kB','blokov',d._blocks,'inzerátov',(d.items||[]).length);for(const it of (d.items||[]).slice(0,4))console.log('  -',it.title,'|',it.price,'|',it.location,'|',it.date);console.log('  lokality blokov:',d._lok||'-');"
          echo
          echo "== kontrola zmlúv =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/contracts.json'));if(!d.ok)console.log('CHYBA',d.error);console.log((d._diag||[]).join(' | '));console.log('roly:',JSON.stringify(d.counts),'spolu',(d.items||[]).length);for(const it of (d.items||[]).slice(0,4))console.log('  -',it.date,'|',it.title.slice(0,50),'|',it.value,'|',it.partner,'|',JSON.stringify(it.roles),it.internal?'INT':'',it.grave?'HROB':'');"
          echo
          echo "== kontrola webu obce =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/obec.json'));if(!d.ok)console.log('CHYBA',d.error);console.log((d._diag||[]).join(' | '));for(const s of d.sections||[]){console.log('-',s.key,s.title,'|',s.items.length);for(const it of s.items.slice(0,3))console.log('    ',it.date,'|',it.title.slice(0,70),'|',(it.meta||'').slice(0,60),'|',it.link.slice(0,90));}"
          echo
          echo "== vek dát (z cache = staršie než tento beh) =="
          node -e "const fs=require('fs');console.log(fs.readdirSync('data').filter(f=>f.endsWith('.json')).map(f=>{const d=JSON.parse(fs.readFileSync('data/'+f));return f.replace('.json','')+':'+(d.ok?'':'CHYBA:')+Math.round((Date.now()-new Date(d.updated))/60000)+'min'+(d.error?' ['+d.error.slice(0,220)+']':'')+(d._lastError?' [posledná chyba: '+d._lastError.slice(0,160)+']':'');}).join(' | '));"
          echo
          echo "== merané ovzdušie =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/airsensor.json'));if(!d.ok)console.log('CHYBA',d.error);console.log((d._diag||[]).join(' | '));for(const i of d.items||[])console.log('  -',i.source,'|',i.name,'|',i.owner,'|',i.distKm,'km |',i.lat,i.lon,'| PM2.5',i.pm25,'(raw',i.pm25raw+') PM10',i.pm10,'| T',i.temp,'RH',i.rh,'|',i.ts,'| id',i.id);"
