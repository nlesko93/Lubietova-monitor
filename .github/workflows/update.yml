name: Aktualizácia dát a nasadenie

on:
  schedule:
    - cron: '17 * * * *'   # každú hodinu
  workflow_dispatch:
  push:
    branches: [main, claude/lubietova-osint-dashboard-reycfe]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nástroje (pdftotext pre cestovné poriadky)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Stiahnuť dáta zo zdrojov
        run: node scripts/fetch/all.mjs

      - name: Zhrnutie dát
        run: |
          echo "## Stav zdrojov" >> "$GITHUB_STEP_SUMMARY"
          for f in data/*.json; do
            ok=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$f')).ok)")
            n=$(node -e "const d=JSON.parse(require('fs').readFileSync('$f'));console.log(d.items?d.items.length:'-')")
            echo "- \`$f\` ok=$ok items=$n" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Overenie nasadenej stránky
        run: |
          sleep 10
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Kontrolujem $url"
          curl -sSf "$url" | grep -q "Ľubietová" && echo "OK: stránka beží"
          curl -sSf "${url}data/news.json" | head -c 200
          echo
          echo "== kontrola autobusov =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/buses.json'));for(const l of d.lines||[]){console.log('linka',l.line,'geometria bodov:',l.geometry?l.geometry.length:0,'dĺžka cum:',l.cum?l.cum[l.cum.length-1]:'-');for(const dir of l.directions||[]){console.log('  smer',dir.dir,'zastávok:',dir.stops.length,'s dist:',dir.stops.filter(s=>s.dist!=null).length,'odchodov:',dir.departures.length);for(const s of dir.stops)console.log('    -',s.name,'časov:',s.times.length);}}"
          echo
          echo "== kontrola webkamier =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/webcams.json'));for(const c of d.items||[]){console.log('-',c.name,'ok='+c.ok,c.snapshot?('snapshot='+c.snapshot):'',c.embed?('embed='+c.embed):'',c.note?('note='+c.note):'');if(c.found&&c.found.length)console.log('    obrázky na stránke:',c.found.join(' , '));}"
          echo
          echo "== kontrola volieb =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/elections.json'));for(const it of d.items||[])console.log('-',it.key,it.name,'|',it.count,'položiek |',it.rows.slice(0,3).map(r=>r.name+':'+r.votes).join(', '));"
          echo
          echo "== kontrola hospodárenia =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/finance.json'));console.log('obdobia:',(d._periods||[]).join(', '));for(const it of (d.items||[]).slice(0,10))console.log('  -',it.title,'|',it.period);"
          echo
          echo "== sonda futbal =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/football.json'));console.log(JSON.stringify(d._diag,null,1).slice(0,2600));"
          echo
          echo "== kontrola bazos =="
          node -e "const d=JSON.parse(require('fs').readFileSync('data/bazos.json'));console.log('status',d._status,'html',d._htmlKb+'kB','blokov',d._blocks,'inzerátov',(d.items||[]).length);for(const it of (d.items||[]).slice(0,4))console.log('  -',it.title,'|',it.price,'|',it.location,'|',it.date);console.log('  lokality blokov:',d._lok||'-');"
